<svg width="34" height="24" viewBox="0 0 34 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Arbitrum Logo Stylized as Bird -->
  <defs>
    <linearGradient id="arbGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#28A0F0;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1E4D8C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D2B5E;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main Arbitrum Bird Body -->
  <ellipse cx="17" cy="12" rx="12" ry="8" fill="url(#arbGradient)" filter="url(#glow)"/>
  
  <!-- Arbitrum "A" Symbol -->
  <path d="M13 6 L17 18 L21 6 M15 12 L19 12" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Bird Eye -->
  <circle cx="22" cy="8" r="2" fill="#FFFFFF"/>
  <circle cx="22" cy="8" r="1" fill="#1E4D8C"/>
  
  <!-- Bird Beak -->
  <polygon points="25,10 28,12 25,14" fill="#FFD700"/>
  
  <!-- Wings (Arbitrum Arrows) -->
  <path d="M8 8 L5 10 L8 12" stroke="#28A0F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M8 12 L5 14 L8 16" stroke="#28A0F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
