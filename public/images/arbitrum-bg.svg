<svg width="400" height="600" viewBox="0 0 400 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0D2B5E;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#1E4D8C;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#28A0F0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5BB8FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="groundGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1A3A5F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D2B5E;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Sky Background -->
  <rect width="400" height="600" fill="url(#skyGradient)"/>
  
  <!-- Floating Blockchain Blocks -->
  <g filter="url(#glow)">
    <!-- Block 1 -->
    <rect x="50" y="80" width="60" height="40" rx="8" fill="#28A0F0" opacity="0.3"/>
    <text x="80" y="105" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-size="8">BLOCK</text>
    
    <!-- Block 2 -->
    <rect x="300" y="150" width="60" height="40" rx="8" fill="#1E4D8C" opacity="0.3"/>
    <text x="330" y="175" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-size="8">CHAIN</text>
    
    <!-- Block 3 -->
    <rect x="100" y="250" width="60" height="40" rx="8" fill="#28A0F0" opacity="0.3"/>
    <text x="130" y="275" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-size="8">ARB</text>
    
    <!-- Block 4 -->
    <rect x="250" y="350" width="60" height="40" rx="8" fill="#1E4D8C" opacity="0.3"/>
    <text x="280" y="375" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-size="8">L2</text>
    
    <!-- Block 5 -->
    <rect x="80" y="450" width="60" height="40" rx="8" fill="#28A0F0" opacity="0.3"/>
    <text x="110" y="475" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-size="8">ETH</text>
  </g>
  
  <!-- Arbitrum Logo Clouds -->
  <g opacity="0.2">
    <!-- Cloud 1 -->
    <ellipse cx="100" cy="120" rx="40" ry="20" fill="#FFFFFF"/>
    <ellipse cx="130" cy="110" rx="25" ry="15" fill="#FFFFFF"/>
    <ellipse cx="70" cy="110" rx="25" ry="15" fill="#FFFFFF"/>
    
    <!-- Cloud 2 -->
    <ellipse cx="320" cy="280" rx="35" ry="18" fill="#FFFFFF"/>
    <ellipse cx="345" cy="270" rx="20" ry="12" fill="#FFFFFF"/>
    <ellipse cx="295" cy="270" rx="20" ry="12" fill="#FFFFFF"/>
    
    <!-- Cloud 3 -->
    <ellipse cx="150" cy="400" rx="30" ry="15" fill="#FFFFFF"/>
    <ellipse cx="170" cy="390" rx="18" ry="10" fill="#FFFFFF"/>
    <ellipse cx="130" cy="390" rx="18" ry="10" fill="#FFFFFF"/>
  </g>
  
  <!-- Ground -->
  <rect x="0" y="550" width="400" height="50" fill="url(#groundGradient)"/>
  
  <!-- Ground Pattern (Hexagonal Grid) -->
  <g opacity="0.3">
    <path d="M20 570 L40 560 L60 570 L60 590 L40 600 L20 590 Z" fill="#28A0F0"/>
    <path d="M80 570 L100 560 L120 570 L120 590 L100 600 L80 590 Z" fill="#1E4D8C"/>
    <path d="M140 570 L160 560 L180 570 L180 590 L160 600 L140 590 Z" fill="#28A0F0"/>
    <path d="M200 570 L220 560 L240 570 L240 590 L220 600 L200 590 Z" fill="#1E4D8C"/>
    <path d="M260 570 L280 560 L300 570 L300 590 L280 600 L260 590 Z" fill="#28A0F0"/>
    <path d="M320 570 L340 560 L360 570 L360 590 L340 600 L320 590 Z" fill="#1E4D8C"/>
  </g>
  
  <!-- Stars/Sparkles -->
  <g opacity="0.6">
    <circle cx="50" cy="50" r="1" fill="#FFFFFF"/>
    <circle cx="150" cy="30" r="1" fill="#FFFFFF"/>
    <circle cx="250" cy="60" r="1" fill="#FFFFFF"/>
    <circle cx="350" cy="40" r="1" fill="#FFFFFF"/>
    <circle cx="100" cy="180" r="1" fill="#FFFFFF"/>
    <circle cx="200" cy="200" r="1" fill="#FFFFFF"/>
    <circle cx="300" cy="180" r="1" fill="#FFFFFF"/>
    <circle cx="80" cy="320" r="1" fill="#FFFFFF"/>
    <circle cx="180" cy="300" r="1" fill="#FFFFFF"/>
    <circle cx="280" cy="320" r="1" fill="#FFFFFF"/>
  </g>
</svg>
