<svg width="64" height="512" viewBox="0 0 64 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pipeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1E4D8C;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#28A0F0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E4D8C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0D2B5E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A3A5F;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main Pipe Body -->
  <rect x="0" y="0" width="64" height="512" fill="url(#pipeGradient)" filter="url(#glow)"/>
  
  <!-- Pipe Border -->
  <rect x="0" y="0" width="64" height="512" fill="none" stroke="url(#borderGradient)" stroke-width="2"/>
  
  <!-- Smart Contract Code Lines -->
  <g opacity="0.7">
    <!-- Line 1 -->
    <rect x="8" y="20" width="48" height="2" fill="#FFFFFF"/>
    <rect x="8" y="25" width="32" height="2" fill="#FFFFFF"/>
    <rect x="8" y="30" width="40" height="2" fill="#FFFFFF"/>
    
